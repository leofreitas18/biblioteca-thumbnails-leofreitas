<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca Thumbnails</title>
<style>
  :root{
    --bg:#0f1420; --bg-alt:#161d2e; --panel:#1b2436; --border:#2a3550;
    --text:#e8ecf5; --text-dim:#8b96ad; --accent:#4f7cff; --accent-hover:#6b91ff;
    --tag-bg:#242f47; --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  header{position:sticky;top:0;z-index:20;background:var(--bg-alt);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
  header h1{font-size:17px;margin:0;white-space:nowrap;font-weight:700;}
  header .counts{font-size:12px;color:var(--text-dim);white-space:nowrap;}
  .search-box{flex:1;min-width:200px;position:relative;}
  .search-box input{width:100%;padding:10px 14px 10px 36px;border-radius:999px;border:1px solid var(--border);background:#fff;color:#0f1420;font-size:14px;transition:box-shadow .15s,border-color .15s;}
  .search-box input::placeholder{color:#7b8294;}
  .search-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,124,255,.25);}
  .search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55;width:16px;height:16px;color:#0f1420;}
  select{
    appearance:none;-webkit-appearance:none;-moz-appearance:none;
    padding:9px 32px 9px 14px;border-radius:999px;border:1px solid var(--border);
    background-color:var(--panel);color:var(--text);font-size:13px;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b96ad' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;background-position:right 11px center;background-size:14px;
    transition:border-color .15s;
  }
  select:hover,select:focus{border-color:var(--accent);outline:none;}
  .btn{padding:9px 16px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:border-color .15s,background .15s,color .15s;}
  .btn:hover{border-color:var(--accent);color:var(--accent-hover);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(79,124,255,.35);}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff;}
  .layout{display:flex;align-items:flex-start;}
  aside{width:260px;flex-shrink:0;height:calc(100vh - 62px);overflow-y:auto;border-right:1px solid var(--border);padding:14px;position:sticky;top:62px;}
  aside h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin:18px 0 8px;}
  aside h2:first-child{margin-top:0;}
  .cat-item,.prov-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 10px;border-radius:999px;cursor:pointer;font-size:13.5px;}
  .cat-item:hover,.prov-item:hover{background:var(--panel);}
  .cat-item.active,.prov-item.active{background:var(--tag-bg);color:#fff;}
  .cat-item .n,.prov-item .n{color:var(--text-dim);font-size:11.5px;}
  #providerSearch{border-radius:999px;}
  main{flex:1;padding:18px 22px;min-width:0;}
  .mobile-filters{display:none;gap:10px;padding:10px 16px;background:var(--bg-alt);border-bottom:1px solid var(--border);}
  .mobile-filters select{flex:1;min-width:0;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .card{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);transition:transform .15s, border-color .15s, box-shadow .15s;}
  .card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 26px rgba(0,0,0,.35);}
  .card .thumb-wrap{aspect-ratio:180/236;background:var(--bg-alt);overflow:hidden;position:relative;border-radius:var(--radius) var(--radius) 0 0;}
  .card img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 10px;border-radius:0 0 var(--radius) var(--radius);overflow:hidden;}
  .card .meta-text{min-width:0;flex:1;}
  .card .name{font-size:12.5px;font-weight:600;line-height:1.25;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .prov{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .tag{position:absolute;top:7px;left:7px;background:rgba(15,20,32,.82);color:#fff;font-size:9.5px;padding:3px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;}
  .card .small-flag{position:absolute;top:7px;right:7px;background:#8a5a1f;color:#fff;font-size:9px;padding:3px 6px;border-radius:999px;}
  .card .dl-single{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.35);text-decoration:none;transition:background .15s,transform .15s;}
  .card .dl-single:hover{background:var(--accent-hover);transform:scale(1.1);}
  .card .dl-single svg{width:14px;height:14px;}
  .empty{color:var(--text-dim);padding:40px;text-align:center;font-size:14px;}
  .load-more-wrap{display:flex;justify-content:center;padding:26px 0 30px;}
  #backToTop{position:fixed;right:22px;bottom:22px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;border:none;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:40;transition:background .15s,transform .15s;}
  #backToTop:hover{background:var(--accent-hover);transform:translateY(-2px);}
  #backToTop svg{width:20px;height:20px;}
  @media (max-width: 860px){
    aside{display:none;}
    .mobile-filters{display:flex;}
  }
  @media (max-width: 480px){
    .grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    main{padding:14px;}
  }
</style>
</head>
<body>
<header>
  <h1>Biblioteca Thumbnails</h1>
  <span class="counts" id="countsLabel"></span>
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Buscar jogo pelo nome...">
  </div>
  <select id="sortSelect">
    <option value="name">Ordenar: Nome (A-Z)</option>
    <option value="provider">Ordenar: Provedor</option>
    <option value="category">Ordenar: Categoria</option>
  </select>
  <a class="btn primary" id="downloadAllBtn" href="https://drive.google.com/file/d/1zBqA9-JIXQxgYxlIJI1uGL3HnKFnACmm/view?usp=sharing" target="_blank" rel="noopener">⬇ Baixar todas (.zip)</a>
</header>
<div class="mobile-filters">
  <select id="mobileCatSelect"></select>
  <select id="mobileProvSelect"></select>
</div>
<div class="layout">
  <aside id="sidebar">
    <h2>Categorias</h2>
    <div id="categoryList"></div>
    <h2>Provedores</h2>
    <input id="providerSearch" type="text" placeholder="Filtrar provedores..." style="width:100%;padding:6px 10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:12.5px;margin-bottom:8px;">
    <div id="providerList"></div>
  </aside>
  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="emptyMsg" style="display:none;">Nenhum jogo encontrado com esses filtros.</div>
    <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
      <button class="btn" id="loadMoreBtn">Carregar mais</button>
    </div>
  </main>
</div>
<button id="backToTop" title="Voltar ao topo" aria-label="Voltar ao topo">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
</button>

function slugifyFile(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

function computeCategoryCounts(){
  const m = new Map();
  for(const g of DATA.games){ m.set(g.category, (m.get(g.category)||0)+1); }
  return m;
}
function computeProviderCounts(category){
  const m = new Map();
  for(const g of DATA.games){
    if(category !== "all" && g.category !== category) continue;
    const key = g.category + '\u0001' + g.provider;
    m.set(key, (m.get(key)||0)+1);
  }
  return m;
}
function sortedProviderEntries(category){
  const provCounts = computeProviderCounts(category);
  const entries = Array.from(provCounts.entries());
  entries.sort((a,b) => {
    if(b[1] !== a[1]) return b[1]-a[1];
    const pa = a[0].split('\u0001')[1], pb = b[0].split('\u0001')[1];
    return pa.localeCompare(pb);
  });
  return entries;
}

function renderSidebar(){
  const catCounts = computeCategoryCounts();
  const catList = document.getElementById('categoryList');
  const totalGames = DATA.games.length;
  let html = `<div class="cat-item ${state.category==='all'?'active':''}" data-cat="all"><span>Todas</span><span class="n">${totalGames}</span></div>`;
  for(const cat of DATA.categories){
    const n = catCounts.get(cat) || 0;
    if(n === 0) continue;
    html += `<div class="cat-item ${state.category===cat?'active':''}" data-cat="${cat}"><span>${CATEGORY_LABELS[cat]||cat}</span><span class="n">${n}</span></div>`;
  }
  catList.innerHTML = html;
  catList.querySelectorAll('.cat-item').forEach(el => {
    el.addEventListener('click', () => {
      state.category = el.dataset.cat;
      state.provider = 'all';
      state.page = 1;
      renderFilters();
      renderGrid();
    });
  });

  const provList = document.getElementById('providerList');
  const pq = (state.providerSearch||'').trim().toLowerCase();
  let entries = sortedProviderEntries(state.category);
  const totalProv = entries.reduce((a,[,n])=>a+n,0);
  if(pq) entries = entries.filter(([key]) => key.split('\u0001')[1].toLowerCase().includes(pq));
  let phtml = `<div class="prov-item ${state.provider==='all'?'active':''}" data-prov="all"><span>Todos</span><span class="n">${totalProv}</span></div>`;

      state.page = 1;
      renderGrid();
      renderFilters();

function getFiltered(){
  const q = state.search.trim().toLowerCase();
  let list = DATA.games.filter(g => {
    if(state.category !== 'all' && g.category !== state.category) return false;
    if(state.provider !== 'all'){
      const key = g.category + '\u0001' + g.provider;
      if(key !== state.provider) return false;
    }
    if(q && !g.name.toLowerCase().includes(q)) return false;
    return true;
  });
  if(state.sort === 'name') list.sort((a,b) => a.name.localeCompare(b.name));
  else if(state.sort === 'provider') list.sort((a,b) => a.provider.localeCompare(b.provider) || a.name.localeCompare(b.name));
  else if(state.sort === 'category') list.sort((a,b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
  return list;
}

  const visible = filtered.slice(0, state.page * PAGE_SIZE);
  grid.innerHTML = visible.map(g => {
    const small = (g.w && g.h && (g.w < 360 || g.h < 472)) ? '<span class="small-flag" title="Imagem original menor que o padrao 2x">menor</span>' : '';
    const fileName = g.file.split('/').pop();
    return `<div class="card">
      <div class="thumb-wrap">
        <span class="tag">${CATEGORY_LABELS[g.category]||g.category}</span>
        ${small}
        <img src="${g.file}" loading="lazy" alt="${g.name}">
      </div>
      <div class="meta">
        <div class="meta-text">
          <div class="name" title="${g.name}">${g.name}</div>
          <div class="prov">${g.provider}</div>
        </div>
        <a class="dl-single" href="${g.file}" download="${fileName}" title="Baixar esta thumbnail" onclick="event.stopPropagation()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
        </a>
      </div>
    </div>`;
  }).join('');

  loadMoreWrap.style.display = visible.length < filtered.length ? 'flex' : 'none';
}

document.getElementById('loadMoreBtn').addEventListener('click', () => {
  state.page++;
  renderGrid();
});
document.getElementById('providerSearch').addEventListener('input', (e) => {
  state.providerSearch = e.target.value;
  renderSidebar();
});
document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  state.page = 1;
  renderGrid();
});
document.getElementById('sortSelect').addEventListener('change', (e) => {
  state.sort = e.target.value;
  state.page = 1;
  renderGrid();
});

const backToTop = document.getElementById('backToTop');
window.addEventListener('scroll', () => {
  backToTop.style.display = window.scrollY > 400 ? 'flex' : 'none';
});
backToTop.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

renderFilters();
renderGrid();
</script>
</body>
</html>
